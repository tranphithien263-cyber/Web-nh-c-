<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(180deg, #0a0a15 0%, #1a0a2e 100%);
  color: #fff;
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  padding: 20px 16px 40px;
}
.header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
.header h1 {
  font-size: 26px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(90deg, #ff0050, #ff7a00, #ffff00, #00f2ea, #ff0050);
  background-size: 300% 100%;
  animation: slide 4s linear infinite;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
@keyframes slide { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
.header p { font-size: 12px; color: #8e8e93; letter-spacing: 1.5px; margin-top: 6px; }
.search-wrap { position: relative; max-width: 600px; margin: 0 auto 20px; }
.search-box {
  width: 100%; padding: 14px 44px 14px 46px;
  background: rgba(30, 30, 50, 0.7);
  border: 2px solid rgba(168, 85, 247, 0.4);
  border-radius: 14px; color: #fff; font-size: 15px; font-family: inherit;
  outline: none;
}
.search-box:focus { border-color: #ff0050; }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; }
.clear-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  display: none; font-size: 14px;
}
.clear-btn.show { display: flex; align-items: center; justify-content: center; }
.filters { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
.filter-btn {
  padding: 8px 18px; border-radius: 20px;
  background: rgba(30, 30, 50, 0.7);
  border: 1px solid rgba(168, 85, 247, 0.4);
  color: #c4b5fd; font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: inherit;
}
.filter-btn.active {
  background: linear-gradient(135deg, #ff0050, #a855f7);
  color: #fff; border-color: #ff0050;
}
.stats-bar { text-align: center; font-size: 12px; color: #8e8e93; margin-bottom: 14px; }
.stats-bar b { color: #ff0050; }
.list { max-width: 600px; margin: 0 auto; }
.song {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: rgba(20, 20, 35, 0.6);
  border: 1px solid rgba(168, 85, 247, 0.2);
  border-radius: 12px; margin-bottom: 8px;
  cursor: pointer;
  text-decoration: none; color: #fff;
}
.song:hover { background: rgba(40, 20, 60, 0.8); border-color: #ff0050; }
.song .cover {
  width: 50px; height: 50px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  background: linear-gradient(135deg, #00f2ea, #ff0050);
}
.song .cover.yt { background: linear-gradient(135deg, #ff0000, #cc0000); }
.song .info { flex: 1; min-width: 0; }
.song .title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.song .artist { font-size: 12px; color: #8e8e93; }
.song .badge { font-size: 9px; padding: 3px 8px; border-radius: 6px; font-weight: 800; }
.song .badge.yt { background: rgba(255, 0, 0, 0.15); border: 1px solid #ff0000; color: #ff6b6b; }
.song .badge.tk { background: rgba(0, 242, 234, 0.15); border: 1px solid #00f2ea; color: #00f2ea; }
.song .arrow { font-size: 16px; color: #6b7280; flex-shrink: 0; }
.empty { text-align: center; padding: 60px 20px; color: #6b7280; }
.empty .big { font-size: 60px; margin-bottom: 16px; }
.footer { text-align: center; font-size: 11px; color: #4b5563; margin-top: 30px; }
</style>
